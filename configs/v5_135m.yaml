model:
  vocab_size: 49152
  block_size: 2048

  hidden_size: 576
  intermediate_size: 1536

  num_hidden_layers: 30
  num_attention_heads: 9
  num_key_value_heads: 3
  head_dim: 64

  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6

  attention_dropout: 0.0
  tie_word_embeddings: true

  architecture:
    norm: rmsnorm
    positional_encoding: rope
    activation: swiglu
    attention: gqa
